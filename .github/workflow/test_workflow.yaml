name: Test Workflow
on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*'
      - 'tests/**/*'
      - 'requirements.txt'
      - '.github/workflow/test_workflow.yaml'

jobs:
  test_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/
